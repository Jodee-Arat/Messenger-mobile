mutation SendSessionSharedSecretKey($data: SessionSharedSecretKeyInput!) {
	sendSessionSharedSecretKey(data: $data) {
		id
		groupId
		chatId
		fromUserId
		toUserId
		fromSessionId
		toSessionId
		keyKind
		senderKeyId
		senderKeyEpoch
		ikPub
		ekPub
		usedOpk
		ukm
		iv
		encryptedKey
		sig
		createdAt
		updatedAt
	}
}
