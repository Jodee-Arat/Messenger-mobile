query GetSessionSharedSecretKeys($chatId: String!, $secretSessionId: String!) {
	getSessionSharedSecretKeys(
		chatId: $chatId
		secretSessionId: $secretSessionId
	) {
		id
		groupId
		chatId
		fromUserId
		toUserId
		fromSessionId
		toSessionId
		keyKind
		senderKeyId
		senderKeyEpoch
		ikPub
		ekPub
		usedOpk
		ukm
		iv
		encryptedKey
		sig
		createdAt
		updatedAt
	}
}
